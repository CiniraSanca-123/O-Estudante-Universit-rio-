<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>O Estudante Universitário - Login</title>
    <link rel="stylesheet" href="login.css">

</head>
<body>

   <div class="container">
     <h1>📚 O Estudante Universitário</h1>
     <p>Faça login ou crie sua conta</p>

       <div class="botoes">
         <button id="btnLogin" class="ativo">Entrar</button>
         <button id="btnCadastro">Criar Conta</button>
       </div>

       <!-- FORMULÁRIO DE LOGIN -->
       <div id="formLogin">
         <input type="email" id="emailLogin" placeholder="E-mail">
         <input type="password" id="senhaLogin" placeholder="Senha">
         <button id="botaoEntrar">Entrar</button>
       </div>

       <!-- FORMULÁRIO DE CADASTRO -->
       <div id="formCadastro" style="display:none">
         <input type="email" id="emailCadastro" placeholder="E-mail">
         <input type="password" id="senhaCadastro" placeholder="Senha (mínimo 6)">
         <button id="botaoCriar">Criar Conta</button>
       </div>

       <p id="mensagem"></p>
   </div>

     
   <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
   <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
   <script src="firebase-config.js"></script>
   <script src="login.js"></script>
    

</body>
</html>
